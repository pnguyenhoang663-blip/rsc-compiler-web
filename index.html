<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASM Compiler</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #1a1b1e; color: #e8e8ec;
  font-family: 'Segoe UI', system-ui, sans-serif;
  height: 100vh; display: flex; flex-direction: column;
}
/* Toolbar */
.toolbar {
  background: #25262b; border-bottom: 1px solid #373a40;
  padding: 8px 16px; display: flex; align-items: center;
  justify-content: space-between; gap: 8px; flex-shrink: 0;
}
.toolbar-left, .toolbar-right { display:flex; align-items:center; gap:6px; }
.tool-btn {
  background: none; border: none; color: #909296;
  padding: 6px 10px; border-radius: 4px; cursor: pointer;
  font-size: 18px; display: flex; align-items: center; gap: 4px;
  transition: all 0.15s;
}
.tool-btn:hover { background: #373a40; color: #e8e8ec; }
.tool-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.divider { width:1px; height:24px; background:#373a40; margin:0 8px; }

/* Model Bar */
.model-bar {
  background: #1e1f23; border-bottom: 1px solid #373a40;
  padding: 6px 16px; display: flex; align-items: center; gap: 8px; flex-shrink:0;
}
.model-label { font-size:12px; font-weight:600; color:#909296; }
.model-select { appearance:none; background:#25262b; border:1px solid #373a40; color:#e8e8ec; padding:5px 28px 5px 12px; border-radius:4px; cursor:pointer; font-size:13px; font-family:Consolas,monospace; outline:none; }

/* Tabs */
.tabs {
  display:flex; background:#1e1f23; border-bottom:1px solid #373a40; flex-shrink:0;
}
.tab {
  padding:8px 20px; cursor:pointer; font-size:12px; font-weight:700;
  color:#5c5f66; text-transform:uppercase; border-bottom:2px solid transparent;
  transition:all 0.15s;
}
.tab:hover { color:#909296; }
.tab.active { color:#b197fc; border-bottom-color:#7c5cfc; }

/* Display bar */
.display-bar {
  display:flex; align-items:center; gap:6px;
  background:#1e1f23; border-bottom:1px solid #373a40;
  padding:5px 12px; flex-shrink:0;
}
.disp-text { font-size:14px; font-weight:700; color:#b197fc; font-family:Consolas,monospace; margin-left:4px; }
.disp-right { margin-left:auto; display:flex; align-items:center; gap:6px; }
.disp-action {
  background:#25262b; border:1px solid #373a40; color:#e8e8ec;
  padding:6px 16px; border-radius:4px; cursor:pointer; font-size:13px;
  font-family:inherit; display:flex; align-items:center; gap:6px; transition:all 0.15s;
}
.disp-action:hover { background:#373a40; border-color:#5c5f66; color:#fff; }
.disp-action.compile-btn { background:#7c5cfc22; border-color:#7c5cfc66; color:#b197fc; font-weight:700; }
.disp-action.compile-btn:hover { background:#7c5cfc44; border-color:#7c5cfc; color:#d0c0ff; }

/* Content */
.content-area { flex:1; display:flex; min-height:0; }
.panel { display:none; flex-direction:column; flex:1; min-height:0; }
.panel.active { display:flex; }
.panel-body { flex:1; display:flex; overflow:hidden; min-height:0; }
.panel-body .output-area {
  flex:1; background:#1a1b1e; padding:10px 16px;
  font-family:Consolas,monospace; font-size:13px;
  overflow-y:auto; white-space:pre-wrap; color:#e8e8ec;
}

/* Editor */
.editor-wrap { flex:1; position:relative; overflow:hidden; }
.editor-highlight {
  position:absolute; top:0; left:0; right:0; bottom:0; margin:0;
  padding:12px 16px; font-family:Consolas,monospace; font-size:14px; line-height:1.6;
  white-space:pre-wrap; overflow:auto; color:#e8e8ec; background:#1a1b1e; z-index:0;
}
#codeEditor {
  position:absolute; top:0; left:0; right:0; bottom:0;
  background:transparent; color:transparent; caret-color:#e8e8ec;
  border:none; outline:none; padding:12px 16px;
  font-family:Consolas,monospace; font-size:14px; line-height:1.6;
  resize:none; tab-size:2; white-space:pre; overflow:auto; z-index:1;
}
.line-numbers {
  background:#1a1b1e; padding:12px 0; min-width:48px; text-align:right;
  color:#373a40; font-family:Consolas,monospace; font-size:14px; line-height:1.6;
  overflow:hidden; padding-right:10px; border-right:1px solid #25262b;
}
.line-numbers span { display:block; padding:0 4px; }

/* Editor tabs */
.editor-tabs {
  display:flex; background:#1e1f23; border-bottom:1px solid #373a40;
  flex-shrink:0; overflow-x:auto; min-height:30px;
}
.editor-tab {
  display:flex; align-items:center; gap:6px; padding:5px 12px;
  font-size:12px; font-family:Consolas,monospace; color:#5c5f66;
  cursor:pointer; border-right:1px solid #373a40; white-space:nowrap;
}
.editor-tab:hover { background:#25262b; color:#e8e8ec; }
.editor-tab.active { background:#1a1b1e; color:#e8e8ec; }
.editor-tab .tab-close { background:none; border:none; color:#5c5f66; cursor:pointer; padding:0 4px; font-size:14px; border-radius:2px; }
.editor-tab .tab-close:hover { color:#ff757f; background:rgba(255,117,127,0.15); }
.editor-tab-add { display:flex; align-items:center; padding:5px 10px; cursor:pointer; color:#5c5f66; font-size:18px; }
.editor-tab-add:hover { color:#e8e8ec; }

/* Welcome screen */
.welcome-screen { display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; padding:40px; background:#1a1b1e; }
.welcome-screen.show { display:flex; }
.welcome-text { font-size:20px; color:#e8e8ec; margin-bottom:30px; text-align:center; }
.welcome-actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
.welcome-btn {
  background:#25262b; border:1px solid #373a40; color:#e8e8ec;
  padding:12px 24px; border-radius:6px; cursor:pointer; font-size:15px;
  font-family:inherit; display:flex; align-items:center; gap:8px; transition:all 0.2s;
}
.welcome-btn:hover { border-color:#7c5cfc; color:#b197fc; }

/* Bottom bar */
.bottom-bar {
  background:#1e1f23; border-top:1px solid #373a40;
  padding:6px 16px; font-size:12px; color:#5c5f66;
  font-family:Consolas,monospace; display:flex; align-items:center; flex-shrink:0;
}

/* Modal */
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:100; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-box { background:#1e1f23; border:1px solid #373a40; border-radius:8px; width:80%; max-width:400px; max-height:80vh; display:flex; flex-direction:column; }
.modal-header { display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid #373a40; }
.modal-title { font-size:14px; font-weight:700; color:#b197fc; }
.modal-close { background:none; border:none; color:#5c5f66; font-size:22px; cursor:pointer; }
.modal-close:hover { color:#e8e8ec; }
.modal-body { flex:1; overflow:auto; padding:12px 16px; }
.modal-body pre { font-family:Consolas,monospace; font-size:13px; color:#e8e8ec; white-space:pre-wrap; }
.set-row { display:flex; align-items:center; justify-content:space-between; padding:7px 0; border-bottom:1px solid #25262b; }
.set-row:last-child { border-bottom:none; }
.set-label { font-size:14px; color:#e8e8ec; }
.set-select { background:#25262b; border:1px solid #373a40; color:#e8e8ec; padding:4px 8px; border-radius:3px; font-size:13px; font-family:inherit; outline:none; cursor:pointer; }
.set-check { width:18px; height:18px; accent-color:#7c5cfc; cursor:pointer; }

/* Scrollbar */
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-track { background:#1a1b1e; }
::-webkit-scrollbar-thumb { background:#373a40; border-radius:4px; }
::-webkit-scrollbar-thumb:hover { background:#5c5f66; }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-left">
    <button class="tool-btn" id="btnLoad" title="Load"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
    <button class="tool-btn" id="btnSave" title="Save"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg></button>
    <div class="divider"></div>
    <button class="tool-btn" id="btnNewProject" title="Them du an"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
    <button class="tool-btn" id="btnOpenProject" title="Mo du an"><svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></button>
    <button class="tool-btn" id="btnSaveProject" title="Luu du an"><svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 9 12 15 7 9"/></svg></button>
    <div class="divider"></div>
    <button class="tool-btn" id="btnSettings" title="Cai dat"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div class="toolbar-right"><span style="font-size:12px;color:#5c5f66;">ASM Compiler</span></div>
</div>

<div class="model-bar">
  <span class="model-label">Model:</span>
  <select class="model-select" id="modelSelect">
    <option value="580vnx">580 VNX</option>
    <option value="880btg">880 BTG</option>
  </select>
</div>

  <div class="tab active" data-tab="input">INPUT</div>
  <div class="tab" data-tab="output">OUTPUT</div>

  <div class="panel active" id="panelInput">
    <div class="editor-tabs" id="editorTabs" style="display:none;"></div>
    <div class="welcome-screen show" id="welcomeScreen">
      <div class="welcome-text" id="welcomeText">Chao mung den voi Compiler</div>

</div>

<div class="modal-overlay" id="settingsOverlay">

<script>
// Elements
const codeEditor = document.getElementById('codeEditor');
const lineNumbers = document.getElementById('lineNumbers');
const statusMessage = document.getElementById('statusMessage');
const outputArea = document.getElementById('outputArea');
const dispMode = document.getElementById('dispMode');
const editorHighlight = document.getElementById('editorHighlight');
const editorBody = document.getElementById('editorBody');
const welcomeScreen = document.getElementById('welcomeScreen');
const welcomeText = document.getElementById('welcomeText');
const welcomeActions = document.getElementById('welcomeActions');
const editorTabs = document.getElementById('editorTabs');

let tabs = [{ id: 1, name: 'project.asm', code: '' }];
let activeTab = 0;
let tabIdCounter = 2;

// Tab switching (INPUT/OUTPUT)
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    const id = 'panel' + t.dataset.tab.charAt(0).toUpperCase() + t.dataset.tab.slice(1);
    document.getElementById(id).classList.add('active');
    dispMode.textContent = t.dataset.tab.toUpperCase();
  });
});

// === Multi-tab ===
function renderTabs() {
  editorTabs.innerHTML = '';
  tabs.forEach((t, i) => {
    const d = document.createElement('div');
    d.className = 'editor-tab' + (i === activeTab ? ' active' : '');
    d.textContent = t.name;
    const x = document.createElement('span');
    x.className = 'tab-close';
    x.textContent = '\u00d7';
    x.onclick = e => { e.stopPropagation(); closeTab(i); };
    d.appendChild(x);
    d.onclick = () => switchTab(i);
    editorTabs.appendChild(d);
  });
  const add = document.createElement('div');
  add.className = 'editor-tab-add';
  add.textContent = '+';
  add.onclick = () => {
    tabs.push({ id: tabIdCounter++, name: 'project.asm', code: '' });
    switchTab(tabs.length - 1);
  };
  editorTabs.appendChild(add);
}

function switchTab(i) {
  tabs[activeTab].code = getCode();
  activeTab = i;
  codeEditor.value = tabs[i].code;
  updateLineNumbers();
  updateHighlight();
  renderTabs();
  saveToStorage();
  showEditor();
}

function closeTab(i) {
  if (tabs.length <= 1) return;
  tabs.splice(i, 1);
  if (activeTab >= tabs.length) activeTab = tabs.length - 1;
  codeEditor.value = tabs[activeTab].code;
  updateLineNumbers();
  updateHighlight();
  renderTabs();
}

function showEditor() {
  welcomeScreen.classList.remove('show');
  welcomeScreen.style.display = 'none';
  editorTabs.style.display = 'flex';
  editorBody.style.display = 'flex';
}

function showWelcome(msg) {
  editorTabs.style.display = 'none';
  editorBody.style.display = 'none';
  welcomeScreen.style.display = 'flex';
  welcomeScreen.classList.add('show');
  if (msg) welcomeText.textContent = msg;
}

// === Project Management ===
const SAVE_KEY = 'rsc_editor_code';
function saveToStorage() {
  tabs[activeTab].code = getCode();
  localStorage.setItem(SAVE_KEY, getCode());
  localStorage.setItem('rsc_tabs', JSON.stringify(tabs.map(t => ({ name: t.name, code: t.code }))));
}

function loadProjects() {
  const saved = localStorage.getItem('rsc_tabs');
  if (saved) {
    try {
      const parsed = JSON.parse(saved);
      if (parsed && parsed.length > 0) {
        tabs = parsed.map((t, i) => ({ id: i + 1, name: t.name, code: t.code }));
        activeTab = 0;
        codeEditor.value = tabs[0].code;
        editorTabs.style.display = 'flex';
        editorBody.style.display = 'flex';
        welcomeScreen.style.display = 'none';
        welcomeScreen.classList.remove('show');
        renderTabs();
        updateLineNumbers();
        updateHighlight();
        statusMessage.textContent = 'Da mo du an cu';
        return true;
      }
    } catch(e) {}
  }
  return false;
}

document.getElementById('welcomeNewBtn').onclick = () => {
  if (!loadProjects()) {
    tabs = [{ id: 1, name: 'project.asm', code: '' }];
    activeTab = 0;
    codeEditor.value = '';
    showEditor();
    renderTabs();
    updateLineNumbers();
    updateHighlight();
    saveToStorage();
    statusMessage.textContent = 'Da tao du an moi';
  }
};

document.getElementById('btnNewProject').onclick = () => {
  tabs.push({ id: tabIdCounter++, name: 'project.asm', code: '' });
  switchTab(tabs.length - 1);
  statusMessage.textContent = 'Da tao tab moi';
};

document.getElementById('btnOpenProject').onclick = () => {
  const saved = localStorage.getItem('rsc_tabs');
  if (!saved) { statusMessage.textContent = 'Khong co du an'; return; }
  const projects = JSON.parse(saved);
  if (!projects || projects.length === 0) { statusMessage.textContent = 'Khong co du an'; return; }
  showWelcome('Chon du an:');
  welcomeActions.innerHTML = projects.map((p, i) =>
    '<button class="welcome-btn" data-idx="' + i + '">' + p.name + '</button>'
  ).join('') + '<button class="welcome-btn" id="welcomeCancel" style="color:#909296;">Huy</button>';
  welcomeActions.querySelectorAll('[data-idx]').forEach(b => {
    b.onclick = function() {
      const idx = parseInt(this.dataset.idx);
      tabs = projects.map((t, i) => ({ id: i + 1, name: t.name, code: t.code }));
      activeTab = idx;
      codeEditor.value = tabs[activeTab].code;
      renderTabs();
      showEditor();
      updateLineNumbers();
      updateHighlight();
      statusMessage.textContent = 'Da mo: ' + tabs[activeTab].name;
    };
  });
  document.getElementById('welcomeCancel').onclick = () => {
    if (tabs.length > 0) showEditor();
    else showWelcome('Chao mung den voi Compiler');
  };
};

document.getElementById('btnSaveProject').onclick = () => {
  const name = prompt('Ten du an:', tabs[activeTab].name);
  if (name && name.trim()) {
    tabs[activeTab].name = name.trim();
    renderTabs();
    saveToStorage();
    statusMessage.textContent = 'Da luu: ' + name;
  }
};

// === Syntax Highlighting ===
function highlightSyntax(code) {
  if (!code) return '';
  const c = {
    gray: '#7F8C98', green: '#A5D6A7', blue: '#7AA2F7',
    mint: '#4FD6BE', purple: '#C792EA', orange: '#FF9E64',
    cyan: '#89DDFF', darkorange: '#F78C6C', pink: '#FF757F'
  };
  return code.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/(\/\*[\s\S]*?\*\/|#.*)/g, '<span style="color:' + c.gray + '">$1</span>')
    .replace(/"[^"]*"/g, '<span style="color:' + c.green + '">$&</span>')
    .replace(/'[^']*'/g, '<span style="color:' + c.green + '">$&</span>')
    .replace(/\b(call|goto|eval|org|backup|calc|return|hex|py)\b/g, '<span style="color:' + c.blue + '">$1</span>')
    .replace(/\b(lbl|func|def|loop|repeat)\b/g, '<span style="color:' + c.purple + '">$1</span>')
    .replace(/\b(reg|var|str)\b/g, '<span style="color:' + c.mint + '">$1</span>')
    .replace(/@(set|section)\.\w+/g, '<span style="color:' + c.orange + '">$&</span>')
    .replace(/\b(er\d{1,2}|r\d{1,2}|sp|pc|ea)\b/gi, '<span style="color:' + c.cyan + '">$1</span>')
    .replace(/\b0x[0-9a-fA-F]+\b|\b\d+\b/g, '<span style="color:' + c.darkorange + '">$&</span>')
    .replace(/\bKEY_[A-Z0-9_]+\b/g, '<span style="color:' + c.pink + '">$&</span>');
}

function updateHighlight() { editorHighlight.innerHTML = highlightSyntax(getCode()); }
function getCode() { return codeEditor.value; }
function setCode(t) { codeEditor.value = t; updateLineNumbers(); updateHighlight(); }

function updateLineNumbers() {
  const lines = getCode().split('\n').length;
  let h = '';
  for (let i = 1; i <= lines; i++) h += '<span>' + i + '</span>';
  lineNumbers.innerHTML = h;
}

codeEditor.addEventListener('input', () => { updateLineNumbers(); updateHighlight(); });
codeEditor.addEventListener('scroll', () => { editorHighlight.scrollTop = codeEditor.scrollTop; editorHighlight.scrollLeft = codeEditor.scrollLeft; });
codeEditor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = e.target.selectionStart, end = e.target.selectionEnd;
    const val = getCode();
    setCode(val.substring(0, start) + '  ' + val.substring(end));
    e.target.selectionStart = e.target.selectionEnd = start + 2;
  }
  if (e.key === 'F5') { e.preventDefault(); compileCode(); }
});

// === Compile ===
document.getElementById('btnCompile').onclick = compileCode;
async function compileCode() {
  const btn = document.getElementById('btnCompile');
  const model = document.getElementById('modelSelect').value;
  btn.disabled = true; btn.textContent = 'Dang compile...';
  statusMessage.textContent = 'Dang bien dich...';
  outputArea.textContent = '';
  document.querySelector('.tab[data-tab="output"]').click();
  try {
    const res = await fetch(API + '/compile', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: getCode(), model: model })
    });
    const data = await res.json();
    if (data.success) {
      outputArea.textContent = data.stdout || '(No output)';
      statusMessage.textContent = 'Thanh cong!';
    } else {
      outputArea.textContent = data.error || data.stdout || 'Loi';
      statusMessage.textContent = 'Loi!';
    }
  } catch {
    outputArea.textContent = 'Khong the ket noi server.\nChay server.py truoc.';
    statusMessage.textContent = 'Loi ket noi!';
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Compile (F5)';
  }
}

// === Display bar actions ===
document.getElementById('btnDispClear').onclick = () => {
  const isInput = document.querySelector('.tab.active').dataset.tab === 'input';
  if (isInput) { setCode(''); statusMessage.textContent = 'Da xoa code'; }
  else { outputArea.textContent = ''; statusMessage.textContent = 'Da xoa output'; }
};
document.getElementById('btnDispCopy').onclick = async () => {
  const isInput = document.querySelector('.tab.active').dataset.tab === 'input';
  const text = isInput ? getCode() : outputArea.textContent;
  if (!text) { statusMessage.textContent = 'Trong'; return; }
  try { await navigator.clipboard.writeText(text); statusMessage.textContent = 'Da sao chep'; }
  catch { statusMessage.textContent = 'Loi sao chep'; }
};

// === Model, Settings, File ===
document.getElementById('modelSelect').onchange = function() { statusMessage.textContent = 'Model: ' + this.value; };
document.getElementById('btnSettings').onclick = () => document.getElementById('settingsOverlay').classList.add('show');
document.getElementById('settingsClose').onclick = () => document.getElementById('settingsOverlay').classList.remove('show');
document.getElementById('settingsOverlay').onclick = (e) => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('show'); };

document.getElementById('btnLoad').onclick = () => {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.asm,.txt';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { setCode(reader.result); statusMessage.textContent = 'Da load: ' + file.name; };
    reader.readAsText(file);
  };
  input.click();
};
document.getElementById('btnSave').onclick = () => {
  const blob = new Blob([getCode()], { type: 'text/plain' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'code.asm'; a.click();
  statusMessage.textContent = 'Da save';
};

// === Auto-save ===
let autoSaveEnabled = true;
let saveTimer;
document.getElementById('autoSaveToggle').onchange = function() { autoSaveEnabled = this.checked; };
codeEditor.addEventListener('input', () => { clearTimeout(saveTimer); saveTimer = setTimeout(saveToStorage, 1000); });

// === Init ===
const API = location.origin || 'http://127.0.0.1:5000';
if (!loadProjects()) { showWelcome('Chao mung den voi Compiler'); }
</script>
</body>
</html>
